<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<body><main>
<header><h1>Ionospheric currents</h1><p>Frozen GAMERA snapshots</p></header>
<div id="viewport" role="img" aria-label="GAMERA current paths and ionospheric field-aligned currents. Drag to rotate; scroll to zoom." aria-busy="true"></div>
<button id="gear" type="button" aria-label="Current display settings" aria-controls="settings" aria-expanded="false"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m9 3-.6 2.1-1.8 1L4.5 5.6 2.9 8.4l1.5 1.6v2l-1.5 1.6 1.6 2.8 2.1-.5 1.8 1L9 19h3l.6-2.1 1.8-1 2.1.5 1.6-2.8-1.5-1.6v-2l1.5-1.6-1.6-2.8-2.1.5-1.8-1L12 3Z" transform="translate(1.5 1)"/><circle cx="12" cy="12" r="3"/></svg></button>
<aside id="settings" aria-label="Current display settings" hidden>
<h2>Currents</h2><div id="current-toggles"></div>
<div class="snapshot"><label for="time">Snapshot</label><span id="elapsed">Loading…</span>
<input id="time" type="range" min="0" max="9" value="4" step="1" aria-label="GAMERA snapshot">
<div class="range-labels"><span>02:00</span><span>24:00</span></div>
<time id="timestamp">Loading snapshots…</time></div>
</aside>
<div id="legend" aria-label="Current types"></div>
<p id="load-error" role="alert" hidden></p>
<footer><span>Drag to rotate · pinch to zoom</span><a href="about.html">Data &amp; method</a></footer>
